name: Build & Release Android APK

# Runs on every push to the main branch (and can be started by hand from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

# "contents: write" is required to publish the GitHub Release that holds the APK.
permissions:
  contents: write

# A newer push cancels the build still running for the previous one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flat repository: every file sits at the root. We put them in the right folders.
      - name: Prepare project folders
        run: |
          mkdir -p lib assets/sounds assets/google_fonts
          mv -f ./*.dart lib/ 2>/dev/null || true
          if [ -f success.wav ]; then mv -f success.wav assets/sounds/success.wav; fi
          [ -f assets/google_fonts/README.txt ] || echo "Cairo fonts (optional)" > assets/google_fonts/README.txt
          if [ ! -f assets/sounds/success.wav ]; then
            python3 - <<'PY'
          import wave, struct, math
          sr=44100; n=int(sr*1.5)
          notes=[(523.25,0.0),(659.25,0.11),(783.99,0.22),(1046.5,0.33)]
          s=[0.0]*n
          for f,st in notes:
              o=int(st*sr)
              for i in range(o,n):
                  t=(i-o)/sr
                  env=math.exp(-3.0*t)*min(1.0,t/0.004)
                  s[i]+=(math.sin(2*math.pi*f*t)+0.3*math.sin(4*math.pi*f*t)+0.1*math.sin(6*math.pi*f*t))*env
          k=0.85/max(abs(x) for x in s)
          w=wave.open('assets/sounds/success.wav','wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',int(x*k*32767)) for x in s))
          w.close()
          PY
          fi

      # The project now holds pubspec.yaml, lib/ and assets/ (android/ is git-ignored).
      # We generate the Android project, then put our own files back on top of it.
      - name: Generate Android scaffolding
        run: |
          if [ ! -d android ]; then
            mkdir /tmp/keep && cp -r pubspec.yaml lib assets /tmp/keep/
            flutter create --org com.teacher --project-name math_teacher --platforms android .
            cp /tmp/keep/pubspec.yaml pubspec.yaml
            rm -rf lib assets && cp -r /tmp/keep/lib lib && cp -r /tmp/keep/assets assets
            rm -rf test
          fi

      # Lets the app see the Text-to-Speech engine on Android 11+ and sets the app name.
      - name: Patch AndroidManifest (TTS + label)
        run: |
          F=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TTS_SERVICE" "$F"; then
            sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n    <application#' "$F"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Math Teacher"#' "$F"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "math-teacher-v1.1.${{ github.run_number }}.apk"

      # Download from: Actions tab > this run > Artifacts
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-teacher-apk
          path: math-teacher-v1.1.${{ github.run_number }}.apk

      # Download from: repository main page > Releases (right column)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Math Teacher v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: math-teacher-v1.1.${{ github.run_number }}.apk
          make_latest: true
          generate_release_notes: true
